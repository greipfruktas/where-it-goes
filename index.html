<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3ecdc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Where It Goes" />
    <title>Where It Goes</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">WHERE IT GOES</p>
          <h1 id="greeting">Your month</h1>
        </div>
        <div class="topbar-actions">
          <div class="style-wrap">
            <button class="style-button" id="styleButton" type="button" aria-label="Choose app style" title="Choose app style" aria-expanded="false">
              <span>Style</span>
              <b id="styleButtonLabel">A</b>
            </button>
            <div id="styleMenu" class="popup-menu style-menu" hidden>
              <button type="button" data-style-option="pocket">Option A <span>Pocket Ledger</span></button>
              <button type="button" data-style-option="neon">Option B <span>Neon Night</span></button>
              <button type="button" data-style-option="swiss">Option C <span>Minimal Swiss</span></button>
            </div>
          </div>
          <div class="export-wrap">
            <button class="icon-button" id="exportButton" aria-label="Export expenses" title="Export expenses" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0-12 4 4m-4-4L8 7M5 13v6h14v-6" /></svg>
            </button>
            <div id="exportMenu" class="popup-menu export-menu" hidden>
              <button type="button" data-export-format="csv">Excel file <span>.csv</span></button>
              <button type="button" data-export-format="json">Backup file <span>.json</span></button>
            </div>
          </div>
        </div>
      </header>

      <main>
        <section id="overviewView" class="view active" aria-labelledby="overviewTab">
          <div class="period-controls">
            <div class="period-switch" role="group" aria-label="Choose date period">
              <button id="monthModeButton" type="button" class="selected" data-period-mode="month">Month</button>
              <button id="rangeModeButton" type="button" data-period-mode="range">Custom dates</button>
            </div>
            <div id="monthControls" class="month-picker">
              <button id="previousMonth" aria-label="Previous month">‹</button>
              <button id="monthLabel" class="month-label" aria-label="Choose month"></button>
              <button id="nextMonth" aria-label="Next month">›</button>
              <input id="monthInput" type="month" aria-label="Month" />
            </div>
            <div id="rangeControls" class="date-range-controls" hidden>
              <div class="date-range-card">
                <label class="date-field">
                  <span>From</span>
                  <span class="date-display"><b id="rangeStartDisplay">1 Aug</b><i aria-hidden="true">▦</i></span>
                  <input id="rangeStartInput" type="date" />
                </label>
                <div class="range-connector" aria-hidden="true">→</div>
                <label class="date-field">
                  <span>To</span>
                  <span class="date-display"><b id="rangeEndDisplay">31 Aug</b><i aria-hidden="true">▦</i></span>
                  <input id="rangeEndInput" type="date" />
                </label>
              </div>
            </div>
          </div>

          <article class="total-card pocket-ledger-card money-wheel-card" aria-labelledby="periodTotalLabel">
            <div id="moneyWheel" class="money-wheel" aria-hidden="true"></div>
            <div class="money-wheel-center">
              <p id="periodTotalLabel">Your share this month</p>
              <strong id="monthTotal">€0.00</strong>
              <div class="total-details">
                <span id="expenseCount">No expenses yet</span>
                <span id="reimbursementSummary" hidden></span>
              </div>
            </div>
          </article>

          <section class="section-block">
            <div class="section-heading">
              <h2>Where it went</h2>
            </div>
            <div id="breakdown" class="breakdown"></div>
          </section>

          <section class="section-block">
            <div class="section-heading">
              <h2>Recent</h2>
              <button class="text-button" data-view-target="history">See all</button>
            </div>
            <div id="recentList" class="expense-list"></div>
          </section>
        </section>

        <section id="historyView" class="view" aria-labelledby="historyTab">
          <div class="page-title">
            <p class="eyebrow">EVERY ENTRY</p>
            <h1>History</h1>
          </div>
          <label class="search-field">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
            <input id="searchInput" type="search" placeholder="Search category, label or note" />
          </label>
          <div id="historyList" class="expense-list history-list"></div>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="Main navigation">
        <button id="overviewTab" class="nav-item active" data-view="overview">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7v9H4z"/><path d="M9 20v-6h6v6"/></svg>
          <span>Overview</span>
        </button>
        <button id="addButton" class="add-button" aria-label="Add expense">
          <span>+</span>
        </button>
        <button id="historyTab" class="nav-item" data-view="history">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
          <span>History</span>
        </button>
      </nav>
    </div>

    <div id="expenseSheet" class="sheet-backdrop" hidden>
      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <div>
            <p class="eyebrow" id="formModeLabel">NEW ENTRY</p>
            <h2 id="sheetTitle">Add expense</h2>
          </div>
          <button id="closeSheet" class="close-button" aria-label="Close">×</button>
        </div>

        <form id="expenseForm">
          <input id="expenseId" type="hidden" />
          <label class="amount-field">
            <span>€</span>
            <input id="amountInput" inputmode="decimal" type="text" placeholder="0.00" autocomplete="off" required aria-label="Amount" />
          </label>

          <fieldset>
            <div class="fieldset-heading">
              <legend>Category</legend>
              <button id="manageGroupsButton" type="button" class="text-button">Edit groups</button>
            </div>
            <div id="categoryChoices" class="choice-grid"></div>
          </fieldset>

          <fieldset>
            <legend>Labels <span>optional</span></legend>
            <div id="labelChoices" class="label-choices"></div>
          </fieldset>

          <fieldset class="reimbursement-field">
            <legend>Money coming back <span>optional</span></legend>
            <div class="reimbursement-choices" id="reimbursementChoices">
              <button type="button" data-reimbursement="0" class="selected">None</button>
              <button type="button" data-reimbursement="50">50%</button>
              <button type="button" data-reimbursement="100">All</button>
              <button type="button" data-reimbursement="custom">Custom</button>
            </div>
            <label id="customReimbursementField" class="custom-reimbursement" hidden>
              <span>Percentage coming back</span>
              <span class="percent-input"><input id="customReimbursementInput" type="number" min="1" max="100" inputmode="numeric" value="25" /><b>%</b></span>
            </label>
            <p id="reimbursementPreview" class="reimbursement-preview" hidden></p>
          </fieldset>

          <div class="form-row">
            <label>
              <span>Date</span>
              <input id="dateInput" type="date" required />
            </label>
            <label>
              <span>Note <em>optional</em></span>
              <input id="noteInput" type="text" maxlength="60" placeholder="Coffee, rent…" />
            </label>
          </div>

          <div class="form-actions">
            <button id="deleteButton" type="button" class="delete-button" hidden>Delete</button>
            <button type="submit" class="save-button">Save expense</button>
          </div>
        </form>
      </section>
    </div>

    <div id="groupsSheet" class="sheet-backdrop" hidden>
      <section class="sheet compact-sheet" role="dialog" aria-modal="true" aria-labelledby="groupsTitle">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <div>
            <p class="eyebrow">GROUPS</p>
            <h2 id="groupsTitle">Edit groups</h2>
          </div>
          <button id="closeGroupsSheet" class="close-button" aria-label="Close">×</button>
        </div>
        <p class="sheet-note">Change the name or emoji. Existing expenses move with the renamed group.</p>
        <div id="groupsList" class="groups-list"></div>
        <button id="saveGroupsButton" type="button" class="save-button full-width-button">Save groups</button>
      </section>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
